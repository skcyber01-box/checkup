    <span>9:41</span>
    <span style="display: flex; gap: 6px; align-items: center">

      <sc-for list="{{ok}}" as="r" hint-placeholder-count="5">

          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f6e44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 12l5 5 9-10"></path></svg>

          <span style="flex: none; font-size: 16px; font-weight: 700; padding: 3px 12px; border-radius: 99px; background: #e0f3e9; color: #0b4d30">ปกติ</span>

  <footer style="flex: none; padding: 12px 16px 30px; background: #ffffff; border-top: 1px solid #cfdbea">

  </footer>
  <div aria-hidden="true" style="position: absolute; bottom: 8px; left: 131px; width: 140px; height: 5px; border-radius: 3px; background: #0f2038"></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":426,"height":898}}'>

    return { ok: T.map((t, i) => ({ t, row: 'display: flex; align-items: center; gap: 12px; min-height: 54px; ' + (i < T.length - 1 ? 'border-bottom: 1px solid #e2e9f2' : '') })) };
  }
}
</script>
