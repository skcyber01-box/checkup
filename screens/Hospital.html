<meta name="mobile-web-app-capable" content="yes">

</head>
<body>
<div class="fit"><div class="stage">
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{text-wrap:pretty}
main>*{flex-shrink:0}
a{color:#1a56c4}a:hover{color:#123f96}
</style>
</helmet>
<div style="width: 426px; height: 898px; box-sizing: border-box; padding: 12px; border-radius: 70px; background: #1c1f26; box-shadow: inset 0 0 0 2px #3b404b; font-family: 'IBM Plex Sans Thai', Tahoma, sans-serif">
<div style="width: 402px; height: 874px; border-radius: 58px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #f4f7fb; color: #0f2038">
  <div aria-hidden="true" style="position: absolute; top: 11px; left: 138px; width: 126px; height: 37px; border-radius: 19px; background: #000000"></div>
  <div aria-hidden="true" style="flex: none; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 44px; font-size: 17px; font-weight: 600; background: #ffffff">
    <span>9:41</span>
    <span style="display: flex; gap: 6px; align-items: center">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#0f2038"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#0f2038"></rect><rect x="10" y="3" width="3" height="9" rx="1" fill="#0f2038"></rect><rect x="15" y="0" width="3" height="12" rx="1" fill="#0f2038"></rect></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#0f2038" stroke-opacity=".4"></rect><rect x="2" y="2" width="20" height="9" rx="2" fill="#0f2038"></rect><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="#0f2038" fill-opacity=".4"></rect></svg>
    </span>
  </div>

  <header style="flex: none; padding: 4px 16px 12px; background: #ffffff; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid #cfdbea">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="Register.dc.html" style="height: 48px; padding: 0 16px 0 8px; border-radius: 24px; display: flex; align-items: center; gap: 4px; background: #eef3f9; color: #0f2038; font-size: 17px; font-weight: 600; text-decoration: none">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f2038" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>ย้อนกลับ
      </a>
      <img src="../assets/dr-assist-logo.webp" alt="Dr.Assist" width="56" height="48" style="height: 48px; width: auto; display: block">
      <button type="button" aria-label="ฟังหน้านี้ด้วยเสียง" style="height: 48px; padding: 0 14px; border-radius: 24px; border: 2px solid #b4c6dd; background: #ffffff; color: #0f2038; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f2038" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>ฟัง
      </button>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
      <strong style="font-family: Anuphan, 'IBM Plex Sans Thai', sans-serif; font-size: 25px; line-height: 1.3">เลือกวันตรวจ</strong>
      <span style="flex: none; font-size: 16px; font-weight: 700; color: #0f6e44">ขั้น 2/3</span>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="hosp" style="font-size: 17px; font-weight: 600; color: #26384f">โรงพยาบาลที่สะดวก <span style="font-weight: 400; color: #3a4b62">(เลือกทีหลังได้)</span></label>
      <select id="hosp" style="width: 100%; box-sizing: border-box; height: 56px; border: 2px solid #b4c6dd; border-radius: 14px; padding: 0 10px; font: inherit; font-size: 19px; font-weight: 600; color: #0f2038; background: #ffffff; cursor: pointer">
        <option>ยังไม่เลือก ให้ระบบแนะนำ</option>
        <option selected>รพ.สต.บ้านหนองบัว · 1.2 กม.</option>
        <option>โรงพยาบาลชุมชนตัวอย่าง · 6.8 กม.</option>
        <option>โรงพยาบาลจังหวัดตัวอย่าง · 24 กม.</option>
      </select>
    </div>

    <section aria-label="ปฏิทินมกราคม 2570" style="background: #ffffff; border: 1px solid #cfdbea; border-radius: 20px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <button type="button" aria-label="เดือนก่อน" disabled style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #eef2f7; display: flex; align-items: center; justify-content: center; padding: 0; cursor: not-allowed"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a9bb0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <strong style="font-size: 20px">มกราคม 2570</strong>
        <button type="button" aria-label="เดือนถัดไป" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #eef3f9; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f2038" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; font-size: 15px; font-weight: 700; color: #3a4b62">
        <span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="36">
          <sc-if value="{{c.blank}}" hint-placeholder-val="{{false}}"><span aria-hidden="true"></span></sc-if>
          <sc-if value="{{c.day}}" hint-placeholder-val="{{true}}">
            <button type="button" onClick="{{c.pick}}" disabled="{{c.dis}}" aria-pressed="{{c.p}}" aria-label="{{c.aria}}" style="{{c.box}}">{{c.n}}</button>
          </sc-if>
        </sc-for>
      </div>
    </section>

    <section style="background: #e3edfc; border-radius: 18px; padding: 10px 16px; display: flex; flex-direction: column; gap: 0">
      <strong style="font-size: 20px; color: #123f96">{{picked}}</strong>
      <span style="font-size: 16px; color: #26384f">ช่องสีเขียว = ว่าง · ไม่ต้องเลือกเวลา</span>
    </section>
  </main>

  <footer style="flex: none; padding: 12px 16px 30px; background: #ffffff; border-top: 1px solid #cfdbea">
    <a href="Confirm.dc.html" style="height: 64px; border-radius: 18px; background: #0f6e44; color: #ffffff; font-size: 21px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">ส่งคำขอนัดตรวจ</a>
  </footer>
  <div aria-hidden="true" style="position: absolute; bottom: 8px; left: 131px; width: 140px; height: 5px; border-radius: 3px; background: #0f2038"></div>
</div>
</div>
</x-dc>
</div></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":426,"height":898}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { d: 12 }; }
  renderVals() {
    // ม.ค. 2570 (ค.ศ. 2027) วันที่ 1 ตรงกับวันศุกร์
    const DOW = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
    const full = { 6: 1, 14: 1, 21: 1 }, seats = { 4: 3, 5: 9, 7: 12, 8: 6, 11: 6, 12: 18, 13: 11, 15: 20, 18: 9, 19: 15, 20: 7, 22: 16, 25: 14, 26: 19, 27: 8, 28: 12, 29: 17 };
    const cells = [];
    for (let i = 0; i < 5; i++) cells.push({ blank: true, day: false });
    for (let n = 1; n <= 31; n++) {
      const dow = (5 + n - 1) % 7, weekend = dow === 0 || dow === 6;
      const open = !weekend && n >= 4 && !full[n];
      const on = n === this.state.d;
      cells.push({
        blank: false, day: true, n, dis: !open, p: on ? 'true' : 'false',
        aria: DOW[dow] + ' ' + n + ' มกราคม' + (open ? ' ว่าง' : ' เลือกไม่ได้'),
        pick: () => { if (open) this.setState({ d: n }); },
        box: 'height: 42px; border-radius: 10px; font: inherit; font-size: 18px; font-weight: 700; padding: 0; font-variant-numeric: tabular-nums; cursor: ' + (open ? 'pointer' : 'default') + '; ' +
          (on ? 'border: 2px solid #1a56c4; background: #1a56c4; color: #ffffff' : open ? 'border: 2px solid #0f6e44; background: #e0f3e9; color: #0b4d30' : 'border: 0; background: #eef2f7; color: #6b7a8e; font-weight: 500')
      });
    }
    const d = this.state.d, dow = (5 + d - 1) % 7;
    return { cells, picked: 'วัน' + DOW[dow] + ' ' + d + ' ม.ค. 2570 · ว่าง ' + (seats[d] || 10) + ' ที่' };
  }
}
</script>
</body>
</html>
