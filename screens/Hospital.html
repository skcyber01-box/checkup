<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Dr.Assist · 3 เลือกที่ตรวจและวัน</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="../assets/dr-assist-logo.webp">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dr.Assist">
<link rel="stylesheet" href="../assets/screen.css">
<script src="../assets/dc-lite.js"></script>
</head>
<body>
<div class="fit"><div class="stage">
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{text-wrap:pretty}
main>*{flex-shrink:0}
a{color:#1a56c4}a:hover{color:#123f96}
</style>
</helmet>
<div style="width: 426px; height: 898px; box-sizing: border-box; padding: 12px; border-radius: 70px; background: #1c1f26; box-shadow: inset 0 0 0 2px #3b404b; font-family: 'IBM Plex Sans Thai', Tahoma, sans-serif">
<div style="width: 402px; height: 874px; border-radius: 58px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #f4f7fb; color: #0f2038">
  <div aria-hidden="true" style="position: absolute; top: 11px; left: 138px; width: 126px; height: 37px; border-radius: 19px; background: #000000"></div>
  <div aria-hidden="true" style="flex: none; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 44px; font-size: 17px; font-weight: 600; background: #ffffff">
    <span>9:41</span>
    <span style="display: flex; gap: 6px; align-items: center">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#0f2038"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#0f2038"></rect><rect x="10" y="3" width="3" height="9" rx="1" fill="#0f2038"></rect><rect x="15" y="0" width="3" height="12" rx="1" fill="#0f2038"></rect></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#0f2038" stroke-opacity=".4"></rect><rect x="2" y="2" width="20" height="9" rx="2" fill="#0f2038"></rect><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="#0f2038" fill-opacity=".4"></rect></svg>
    </span>
  </div>

  <header style="flex: none; padding: 4px 16px 12px; background: #ffffff; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid #cfdbea">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="Register.dc.html" style="height: 48px; padding: 0 16px 0 8px; border-radius: 24px; display: flex; align-items: center; gap: 4px; background: #eef3f9; color: #0f2038; font-size: 17px; font-weight: 600; text-decoration: none">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f2038" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>ย้อนกลับ
      </a>
      <img src="../assets/dr-assist-logo.webp" alt="Dr.Assist" width="56" height="48" style="height: 48px; width: auto; display: block">
      <button type="button" aria-label="ฟังหน้านี้ด้วยเสียง" style="height: 48px; padding: 0 14px; border-radius: 24px; border: 2px solid #b4c6dd; background: #ffffff; color: #0f2038; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f2038" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>ฟัง
      </button>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
      <strong style="font-family: Anuphan, 'IBM Plex Sans Thai', sans-serif; font-size: 25px; line-height: 1.3">เลือกที่ตรวจและวัน</strong>
      <span style="flex: none; font-size: 16px; font-weight: 700; color: #0f6e44">ขั้น 2/3</span>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <strong style="font-size: 19px">ตรวจที่</strong>
    <section style="background: #ffffff; border: 3px solid #1a56c4; border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="align-self: flex-start; font-size: 14px; font-weight: 700; color: #ffffff; background: #0f6e44; padding: 1px 10px; border-radius: 99px">ที่ประจำของคุณ</span>
        <strong style="font-size: 20px; line-height: 1.35">รพ.สต.บ้านหนองบัว</strong>
        <span style="font-size: 16px; color: #3a4b62">ห่างจากบ้าน 1.2 กม.</span>
      </div>
      <button type="button" style="flex: none; height: 48px; padding: 0 14px; border-radius: 14px; border: 2px solid #b4c6dd; background: #ffffff; color: #1a56c4; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer">เปลี่ยน</button>
    </section>

    <strong style="font-size: 19px; margin-top: 4px">วันไหน (มกราคม 2570)</strong>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{ds}}" as="d" hint-placeholder-count="4">
        <button type="button" onClick="{{d.pick}}" aria-pressed="{{d.p}}" disabled="{{d.dis}}" style="{{d.box}}">
          <strong style="font-size: 20px">{{d.label}}</strong>
          <span style="{{d.leftStyle}}">{{d.left}}</span>
        </button>
      </sc-for>
    </div>

    <strong style="font-size: 19px; margin-top: 4px">เวลาไหน</strong>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" onClick="{{am}}" aria-pressed="{{amP}}" style="{{amStyle}}"><strong style="font-size: 19px">รอบเช้า</strong><span style="font-size: 16px">07:30–09:00 น.</span></button>
      <button type="button" onClick="{{pm}}" aria-pressed="{{pmP}}" style="{{pmStyle}}"><strong style="font-size: 19px">รอบสาย</strong><span style="font-size: 16px">09:00–10:30 น.</span></button>
    </div>
  </main>

  <footer style="flex: none; padding: 12px 16px 30px; background: #ffffff; border-top: 1px solid #cfdbea">
    <a href="Confirm.dc.html" style="height: 64px; border-radius: 18px; background: #0f6e44; color: #ffffff; font-size: 21px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">ยืนยันนัดตรวจ</a>
  </footer>
  <div aria-hidden="true" style="position: absolute; bottom: 8px; left: 131px; width: 140px; height: 5px; border-radius: 3px; background: #0f2038"></div>
</div>
</div>
</x-dc>
</div></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":426,"height":898}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { d: 1, slot: 'am' }; }
  renderVals() {
    const D = [['จ. 11 ม.ค.', 6], ['อ. 12 ม.ค.', 18], ['พ. 13 ม.ค.', 11], ['พฤ. 14 ม.ค.', 0]];
    const sel = this.state;
    const slot = (on) => 'min-height: 70px; border-radius: 16px; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; ' +
      (on ? 'border: 3px solid #1a56c4; background: #1a56c4; color: #ffffff' : 'border: 2px solid #b4c6dd; background: #ffffff; color: #0f2038');
    return {
      ds: D.map(([label, n], i) => {
        const on = i === sel.d, full = !n;
        return {
          label, p: on ? 'true' : 'false', dis: full,
          left: full ? 'เต็มแล้ว' : 'ว่าง ' + n + ' ที่',
          pick: () => { if (!full) this.setState({ d: i }); },
          box: 'min-height: 70px; border-radius: 16px; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: ' + (full ? 'not-allowed' : 'pointer') + '; ' +
            (on ? 'border: 3px solid #1a56c4; background: #1a56c4; color: #ffffff' : full ? 'border: 2px solid #dfe6ef; background: #eef2f7; color: #5d6c80' : 'border: 2px solid #b4c6dd; background: #ffffff; color: #0f2038'),
          leftStyle: 'font-size: 16px; ' + (on ? 'color: #ffffff' : full ? 'color: #5d6c80' : n < 8 ? 'color: #8a4b00; font-weight: 600' : 'color: #3a4b62')
        };
      }),
      am: () => this.setState({ slot: 'am' }), pm: () => this.setState({ slot: 'pm' }),
      amStyle: slot(sel.slot === 'am'), pmStyle: slot(sel.slot === 'pm'),
      amP: sel.slot === 'am' ? 'true' : 'false', pmP: sel.slot === 'pm' ? 'true' : 'false'
    };
  }
}
</script>
</body>
</html>
