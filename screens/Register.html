<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Dr.Assist · 2 ลงทะเบียนตรวจสุขภาพ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="../assets/dr-assist-logo.webp">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dr.Assist">
<link rel="stylesheet" href="../assets/screen.css">
<script src="../assets/dc-lite.js"></script>
</head>
<body>
<div class="fit"><div class="stage">
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{text-wrap:pretty}
main>*{flex-shrink:0}
a{color:#1a56c4}a:hover{color:#123f96}
</style>
</helmet>
<div style="width: 426px; height: 898px; box-sizing: border-box; padding: 12px; border-radius: 70px; background: #1c1f26; box-shadow: inset 0 0 0 2px #3b404b; font-family: 'IBM Plex Sans Thai', Tahoma, sans-serif">
<div style="width: 402px; height: 874px; border-radius: 58px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #f4f7fb; color: #0f2038">
  <div aria-hidden="true" style="position: absolute; top: 11px; left: 138px; width: 126px; height: 37px; border-radius: 19px; background: #000000"></div>
  <div aria-hidden="true" style="flex: none; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 44px; font-size: 17px; font-weight: 600; background: #ffffff">
    <span>9:41</span>
    <span style="display: flex; gap: 6px; align-items: center">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#0f2038"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#0f2038"></rect><rect x="10" y="3" width="3" height="9" rx="1" fill="#0f2038"></rect><rect x="15" y="0" width="3" height="12" rx="1" fill="#0f2038"></rect></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#0f2038" stroke-opacity=".4"></rect><rect x="2" y="2" width="20" height="9" rx="2" fill="#0f2038"></rect><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="#0f2038" fill-opacity=".4"></rect></svg>
    </span>
  </div>

  <header style="flex: none; padding: 4px 16px 12px; background: #ffffff; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid #cfdbea">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="Main.dc.html" style="height: 48px; padding: 0 16px 0 8px; border-radius: 24px; display: flex; align-items: center; gap: 4px; background: #eef3f9; color: #0f2038; font-size: 17px; font-weight: 600; text-decoration: none">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f2038" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>ย้อนกลับ
      </a>
      <img src="../assets/dr-assist-logo.webp" alt="Dr.Assist" width="56" height="48" style="height: 48px; width: auto; display: block">
      <button type="button" aria-label="ฟังหน้านี้ด้วยเสียง" style="height: 48px; padding: 0 14px; border-radius: 24px; border: 2px solid #b4c6dd; background: #ffffff; color: #0f2038; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f2038" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>ฟัง
      </button>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
      <strong style="font-family: Anuphan, 'IBM Plex Sans Thai', sans-serif; font-size: 25px; line-height: 1.3">ลงทะเบียนตรวจสุขภาพ</strong>
      <span style="flex: none; font-size: 16px; font-weight: 700; color: #0f6e44">ขั้น 1/3</span>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <section style="background: #e0f3e9; border-radius: 18px; padding: 12px 16px; display: flex; gap: 12px; align-items: center">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0f6e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
      <div style="display: flex; flex-direction: column; min-width: 0">
        <strong style="font-size: 20px">นายสมชาย ใจดี · 61 ปี</strong>
        <span style="font-size: 17px; color: #0b4d30">สิทธิบัตรทอง ไม่เสียเงิน</span>
      </div>
    </section>

    <section style="background: #ffffff; border: 1px solid #cfdbea; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <strong style="font-size: 20px">ได้ตรวจ 6 รายการ</strong>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
          <div style="display: flex; gap: 6px; align-items: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f6e44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 12l5 5 9-10"></path></svg>
            <span style="font-size: 18px; line-height: 1.35">{{it}}</span>
          </div>
        </sc-for>
      </div>
      <span style="font-size: 17px; color: #8a4b00; font-weight: 600; background: #fbefd9; border-radius: 10px; padding: 6px 10px">น้ำตาลและไขมัน ต้องงดอาหารก่อนตรวจ</span>
    </section>

    <section style="background: #ffffff; border: 1px solid #cfdbea; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 19px; font-weight: 600; line-height: 1.45">ตอนนี้มีอาการไม่สบาย ที่อยากให้หมอดูไหม</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button type="button" onClick="{{yes}}" aria-pressed="{{yesP}}" style="{{yesStyle}}">มี</button>
        <button type="button" onClick="{{no}}" aria-pressed="{{noP}}" style="{{noStyle}}">ไม่มี</button>
      </div>
    </section>

    <label for="pdpa" style="display: flex; gap: 12px; align-items: center; background: #ffffff; border: 1px solid #cfdbea; border-radius: 18px; padding: 12px 16px; font-size: 18px; line-height: 1.45; cursor: pointer">
      <input id="pdpa" type="checkbox" checked style="width: 32px; height: 32px; margin: 0; accent-color: #0f6e44; flex: none">
      <span>ยินยอมให้ใช้ข้อมูลสุขภาพ เพื่อตรวจและติดตามผล</span>
    </label>
  </main>

  <footer style="flex: none; padding: 12px 16px 30px; background: #ffffff; border-top: 1px solid #cfdbea">
    <a href="Hospital.dc.html" style="height: 64px; border-radius: 18px; background: #0f6e44; color: #ffffff; font-size: 21px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">ถัดไป: เลือกที่ตรวจ</a>
  </footer>
  <div aria-hidden="true" style="position: absolute; bottom: 8px; left: 131px; width: 140px; height: 5px; border-radius: 3px; background: #0f2038"></div>
</div>
</div>
</x-dc>
</div></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":426,"height":898}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sick: false }; }
  renderVals() {
    const on = 'height: 56px; border-radius: 16px; border: 3px solid #1a56c4; background: #1a56c4; color: #ffffff; font: inherit; font-size: 20px; font-weight: 700; cursor: pointer';
    const off = 'height: 56px; border-radius: 16px; border: 2px solid #b4c6dd; background: #ffffff; color: #0f2038; font: inherit; font-size: 20px; font-weight: 600; cursor: pointer';
    const y = this.state.sick;
    return {
      items: ['ความดัน น้ำหนัก', 'น้ำตาลในเลือด', 'ไขมันในเลือด', 'การทำงานของไต', 'สายตา การได้ยิน', 'ความจำ การหกล้ม'],
      yes: () => this.setState({ sick: true }), no: () => this.setState({ sick: false }),
      yesStyle: y ? on : off, noStyle: y ? off : on, yesP: y ? 'true' : 'false', noP: y ? 'false' : 'true'
    };
  }
}
</script>
</body>
</html>
