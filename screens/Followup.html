<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Dr.Assist · 7 ดูแลต่อหลังรับผล</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="../assets/dr-assist-logo.webp">
<link rel="stylesheet" href="../assets/screen.css">
<script src="../assets/dc-lite.js"></script>
</head>
<body>
<div class="fit"><div class="stage">
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{text-wrap:pretty}
main>*{flex-shrink:0}
a{color:#1a56c4}a:hover{color:#123f96}
</style>
</helmet>
<div style="width: 426px; height: 898px; box-sizing: border-box; padding: 12px; border-radius: 70px; background: #1c1f26; box-shadow: inset 0 0 0 2px #3b404b; font-family: 'IBM Plex Sans Thai', Tahoma, sans-serif">
<div style="width: 402px; height: 874px; border-radius: 58px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #f4f7fb; color: #0f2038">
  <div aria-hidden="true" style="position: absolute; top: 11px; left: 138px; width: 126px; height: 37px; border-radius: 19px; background: #000000"></div>
  <div aria-hidden="true" style="flex: none; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 44px; font-size: 17px; font-weight: 600; background: #ffffff">
    <span>9:41</span>
    <span style="display: flex; gap: 6px; align-items: center">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#0f2038"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#0f2038"></rect><rect x="10" y="3" width="3" height="9" rx="1" fill="#0f2038"></rect><rect x="15" y="0" width="3" height="12" rx="1" fill="#0f2038"></rect></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#0f2038" stroke-opacity=".4"></rect><rect x="2" y="2" width="20" height="9" rx="2" fill="#0f2038"></rect><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="#0f2038" fill-opacity=".4"></rect></svg>
    </span>
  </div>

  <header style="flex: none; padding: 4px 16px 12px; background: #ffffff; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid #cfdbea">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="Results.dc.html" style="height: 48px; padding: 0 16px 0 8px; border-radius: 24px; display: flex; align-items: center; gap: 4px; background: #eef3f9; color: #0f2038; font-size: 17px; font-weight: 600; text-decoration: none">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f2038" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>ย้อนกลับ
      </a>
      <img src="../assets/dr-assist-logo.webp" alt="Dr.Assist" width="56" height="48" style="height: 48px; width: auto; display: block">
      <button type="button" aria-label="ฟังหน้านี้ด้วยเสียง" style="height: 48px; padding: 0 14px; border-radius: 24px; border: 2px solid #b4c6dd; background: #ffffff; color: #0f2038; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f2038" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>ฟัง
      </button>
    </div>
    <strong style="font-family: Anuphan, 'IBM Plex Sans Thai', sans-serif; font-size: 25px; line-height: 1.3">ดูแลเรื่องน้ำตาล</strong>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <section style="background: #1a56c4; color: #ffffff; border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 17px; color: #e3edfc">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3z"></path></svg>
        หมอจะโทรวิดีโอหาคุณ
      </span>
      <strong style="font-family: Anuphan, 'IBM Plex Sans Thai', sans-serif; font-size: 27px; line-height: 1.3">พุธ 20 ม.ค. · 10:00 น.</strong>
      <span style="font-size: 17px">ปุ่มรับสายจะขึ้นเมื่อถึงเวลา</span>
    </section>

    <section aria-label="สิ่งที่ต้องทำทุกวัน" style="background: #ffffff; border: 1px solid #cfdbea; border-radius: 20px; padding: 10px 16px 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
        <strong style="font-size: 20px">ทำทุกวัน</strong>
        <span style="font-size: 16px; color: #3a4b62">{{doneText}}</span>
      </div>
      <sc-for list="{{todo}}" as="t" hint-placeholder-count="3">
        <label for="{{t.id}}" style="{{t.row}}">
          <input id="{{t.id}}" type="checkbox" checked="{{t.done}}" onChange="{{t.toggle}}" style="width: 32px; height: 32px; margin: 0; accent-color: #0f6e44; flex: none">
          <span style="{{t.titleStyle}}">{{t.t}}</span>
        </label>
      </sc-for>
    </section>

    <section style="background: #ffffff; border: 1px solid #cfdbea; border-radius: 20px; padding: 14px 16px; display: flex; gap: 12px; align-items: center">
      <div aria-hidden="true" style="flex: none; width: 52px; height: 52px; border-radius: 26px; background: #e0f3e9; color: #0f6e44; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">มล</div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <strong style="font-size: 19px; line-height: 1.35">อสม. มาลัย มาเยี่ยมบ้าน</strong>
        <span style="font-size: 16px; color: #3a4b62">มาวัดน้ำตาลให้ใน ก.พ.</span>
      </div>
      <button type="button" style="flex: none; height: 56px; padding: 0 14px; border-radius: 16px; border: 2px solid #0f6e44; background: #ffffff; color: #0f6e44; font: inherit; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f6e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>โทร
      </button>
    </section>

    <section style="background: #e3edfc; border-radius: 18px; padding: 12px 16px; font-size: 18px; line-height: 1.45"><strong style="color: #123f96">ตรวจน้ำตาลซ้ำ เม.ย. 2570</strong> ที่ รพ.สต.บ้านหนองบัว</section>
  </main>

  <footer style="flex: none; padding: 12px 16px 30px; background: #ffffff; border-top: 1px solid #cfdbea">
    <a href="Main.dc.html" style="height: 64px; border-radius: 18px; border: 2px solid #b4c6dd; color: #0f2038; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box">กลับหน้าแรก</a>
  </footer>
  <div aria-hidden="true" style="position: absolute; bottom: 8px; left: 131px; width: 140px; height: 5px; border-radius: 3px; background: #0f2038"></div>
</div>
</div>
</x-dc>
</div></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":426,"height":898}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { d: { a: true, b: false, c: false } }; }
  renderVals() {
    const T = [['a', 'ไม่ดื่มน้ำหวาน น้ำอัดลม'], ['b', 'เดินเร็ว 30 นาที'], ['c', 'ลดข้าวเหนียวและขนมหวาน']];
    const d = this.state.d;
    const n = T.filter(([k]) => d[k]).length;
    return {
      doneText: 'ทำแล้ว ' + n + '/' + T.length,
      todo: T.map(([k, t], i) => ({
        id: 'todo-' + k, t, done: !!d[k],
        toggle: () => this.setState({ d: Object.assign({}, d, { [k]: !d[k] }) }),
        row: 'display: flex; gap: 14px; align-items: center; min-height: 56px; cursor: pointer; ' + (i < T.length - 1 ? 'border-bottom: 1px solid #e2e9f2' : ''),
        titleStyle: 'font-size: 19px; line-height: 1.4; ' + (d[k] ? 'color: #3a4b62; text-decoration: line-through' : 'font-weight: 600')
      }))
    };
  }
}
</script>
</body>
</html>
