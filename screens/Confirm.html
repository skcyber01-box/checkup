<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":426,"height":898}}'>

  renderVals() {

      onA: on ? 'true' : 'false',

      track: 'flex: none; width: 68px; height: 40px; border-radius: 20px; border: 0; padding: 4px; cursor: pointer; display: flex; ' + (on ? 'background: #0f6e44; justify-content: flex-end' : 'background: #8a9bb0; justify-content: flex-start')
