<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":426,"height":898}}'>
class Component extends DCLogic {
  renderVals() {
    const N = 21, cells = [];
    const finder = (r, c) => {
      for (const [r0, c0] of [[0, 0], [0, 14], [14, 0]]) {
        const y = r - r0, x = c - c0;
        if (y >= 0 && y < 7 && x >= 0 && x < 7) {
          const edge = y === 0 || y === 6 || x === 0 || x === 6;
          const core = y >= 2 && y <= 4 && x >= 2 && x <= 4;
          return edge || core ? 1 : 0;
        }
        if (y >= -1 && y <= 7 && x >= -1 && x <= 7) return 0;
      }
      return null;
    };
    let seed = 7;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      let v = finder(r, c);
      if (v === null) { seed = (seed * 9301 + 49297) % 233280; v = seed / 233280 > 0.52 ? 1 : 0; }
      cells.push('display: block; background: ' + (v ? '#0f2038' : '#ffffff'));
    }
    return { cells };
  }
}
</script>
